<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>出海小站练站营</title>
    <meta name="description" content="本地关卡式出海 SEO 练站打卡：站一→站二→站三，勾选即实战记账。" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/ui.css" />
  </head>
  <body>
    <div id="app">
      <header class="game-header">
        <h1>出海小站练站营</h1>
        <p class="tagline">搜索之海 · 建站冒险 · 勾选=线下做完</p>
      </header>

      <div id="hud" class="hud" aria-label="状态栏"></div>

      <nav class="tabs" role="tablist" aria-label="主导航">
        <button type="button" class="tab-btn active" role="tab" data-tab="map" aria-selected="true">地图</button>
        <button type="button" class="tab-btn" role="tab" data-tab="quest" aria-selected="false">任务</button>
        <button type="button" class="tab-btn" role="tab" data-tab="ship" aria-selected="false">商船</button>
        <button type="button" class="tab-btn" role="tab" data-tab="ach" aria-selected="false">成就</button>
        <button type="button" class="tab-btn" role="tab" data-tab="resources" aria-selected="false">资源库</button>
        <button type="button" class="tab-btn" role="tab" data-tab="settings" aria-selected="false">设置</button>
      </nav>

      <main>
        <section id="panel-map" class="tab-panel" role="tabpanel"></section>
        <section id="panel-quest" class="tab-panel" role="tabpanel" hidden></section>
        <section id="panel-ship" class="tab-panel" role="tabpanel" hidden></section>
        <section id="panel-ach" class="tab-panel" role="tabpanel" hidden></section>
        <section id="panel-resources" class="tab-panel" role="tabpanel" hidden></section>
        <section id="panel-settings" class="tab-panel" role="tabpanel" hidden></section>
      </main>

      <p class="footer-note">
        游戏不能替你建站。收入案例≠保证。进度仅存本机浏览器。
      </p>
    </div>

    <script src="js/save.js"></script>
    <script src="js/data.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/sfx.js"></script>
    <script src="js/ui-modal.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/weekly.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/map.js"></script>
    <script src="js/quest.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
