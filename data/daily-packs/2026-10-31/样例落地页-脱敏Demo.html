<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>示例咖啡小馆｜社区手冲咖啡</title><meta name="description" content="示例落地页：社区手冲咖啡店介绍（虚构内容，仅作作品样例）">
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b2b2b;line-height:1.6}
header{background:linear-gradient(135deg,#6b4226,#c08552);color:#fff;padding:64px 20px;text-align:center}header h1{margin:0 0 8px;font-size:2rem}
.btn{display:inline-block;margin-top:16px;padding:10px 22px;border-radius:24px;background:#fff;color:#6b4226;text-decoration:none;font-weight:600}
section{max-width:960px;margin:0 auto;padding:40px 20px}h2{color:#6b4226}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{border:1px solid #eee;border-radius:12px;padding:16px;background:#fffaf5}footer{text-align:center;padding:24px;color:#888;font-size:.85rem}</style></head>
<body><header><h1>示例咖啡小馆</h1><p>社区里的一杯安静手冲</p><a class="btn" href="#contact">查看地址与营业时间</a></header>
<section><h2>关于我们</h2><p>【虚构样例】我们是一家只有 8 个座位的小店，每周更换两款单品豆。</p></section>
<section><h2>招牌饮品</h2><div class="grid"><div class="card"><h3>今日单品手冲</h3><p>价格以店内为准</p></div><div class="card"><h3>燕麦拿铁</h3><p>价格以店内为准</p></div><div class="card"><h3>冷萃</h3><p>夏季限定</p></div></div></section>
<section><h2>顾客说</h2><div class="grid"><div class="card">“适合周末看书。”——示例评价</div><div class="card">“豆子会认真介绍。”——示例评价</div></div></section>
<section id="contact"><h2>到店</h2><p>地址：【待客户提供】<br>营业时间：【待客户提供】<br>电话：【待客户提供】</p></section>
<footer>本页为作品样例，内容均为虚构。</footer></body></html>
